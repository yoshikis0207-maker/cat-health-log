<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猫の体調管理ログ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-12">
    <div class="max-w-md mx-auto p-4 space-y-6">
        <header class="text-center pt-4">
            <h1 class="text-2xl font-bold text-indigo-600">🐾 にゃんこログ</h1>
            <p class="text-xs text-gray-500 mt-1">家族みんなの健康管理</p>
        </header>

        <!-- 記録フォーム -->
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
            <h2 class="font-bold text-sm text-gray-700">いまの記録を追加</h2>
            
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">GitHub アクセストークン (PAT)</label>
                <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" class="w-full p-2.5 text-sm border rounded-xl bg-gray-50">
                <p class="text-[10px] text-gray-400 mt-1">※初回のみ入力。ブラウザに保存されます。</p>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">きろくの種類</label>
                <div class="grid grid-cols-3 gap-2" id="type-buttons">
                    <button type="button" data-type="ごはん" class="type-btn p-3 bg-indigo-50 text-indigo-700 border-2 border-indigo-500 rounded-xl font-bold text-sm">ごはん</button>
                    <button type="button" data-type="トイレ" class="type-btn p-3 bg-gray-50 text-gray-600 border-2 border-transparent rounded-xl font-bold text-sm">トイレ</button>
                    <button type="button" data-type="体調・他" class="type-btn p-3 bg-gray-50 text-gray-600 border-2 border-transparent rounded-xl font-bold text-sm">体調・他</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">詳細メモ</label>
                <input type="text" id="memo" placeholder="例: カリカリ30g完食 / うんち普通" class="w-full p-3 text-sm border rounded-xl">
            </div>

            <button id="save-btn" class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold shadow-md active:scale-95 transition-transform">
                記録を保存する
            </button>
        </div>

        <!-- 履歴一覧 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <h2 class="font-bold text-sm text-gray-700">これまでの記録</h2>
            <div id="log-list" class="divide-y divide-gray-100">
                <p class="text-xs text-gray-400 text-center py-4">読み込み中...</p>
            </div>
        </div>
    </div>

    <script>
        const REPO = "yoshikis0207-maker/cat-health-log";
        let selectedType = "ごはん";

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.type-btn').forEach(b => {
                    b.classList.remove('bg-indigo-50', 'text-indigo-700', 'border-indigo-500');
                    b.classList.add('bg-gray-50', 'text-gray-600', 'border-transparent');
                });
                const target = e.currentTarget;
                target.classList.remove('bg-gray-50', 'text-gray-600', 'border-transparent');
                target.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-500');
                selectedType = target.dataset.type;
            });
        });

        const tokenInput = document.getElementById('token');
        const savedToken = localStorage.getItem('github_token');
        if (savedToken) tokenInput.value = savedToken;
        tokenInput.addEventListener('input', (e) => {
            localStorage.setItem('github_token', e.target.value);
        });

        async function fetchLogs() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/data.json?t=${new Date().getTime()}`);
                const logs = await res.json();
                const listEl = document.getElementById('log-list');
                
                if (!logs || logs.length === 0) {
                    listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">まだ記録がありません</p>';
                    return;
                }

                listEl.innerHTML = logs.reverse().map(log => `
                    <div class="py-3 first:pt-0 last:pb-0 flex justify-between items-center">
                        <div>
                            <span class="inline-block px-2 py-0.5 text-xs font-bold rounded-md ${log.type === 'ごはん' ? 'bg-orange-100 text-orange-700' : log.type === 'トイレ' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${log.type}</span>
                            <p class="text-sm mt-1 text-gray-800">${log.memo || '（メモなし）'}</p>
                        </div>
                        <span class="text-[10px] text-gray-400">${log.date}</span>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('log-list').innerHTML = '<p class="text-xs text-red-400 text-center py-4">データの読み込みに失敗しました</p>';
            }
        }

        document.getElementById('save-btn').addEventListener('click', async () => {
            const token = tokenInput.value.trim();
            const memo = document.getElementById('memo').value.trim();

            if (!token) {
                alert('GitHubのアクセストークンを入力してください');
                return;
            }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';

            try {
                const fileRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!fileRes.ok) throw new Error('認証エラーまたはファイル取得失敗');
                const fileJson = await fileRes.json();
                
                let currentLogs = [];
                try {
                    currentLogs = JSON.parse(atob(fileJson.content));
                } catch(e) {}

                const now = new Date();
                const dateStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                
                currentLogs.push({
                    type: selectedType,
                    memo: memo,
                    date: dateStr
                });

                const updateRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Add cat health log',
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(currentLogs, null, 2)))),
                        sha: fileJson.sha
                    })
                });

                if (!updateRes.ok) throw new Error('保存に失敗しました');

                document.getElementById('memo').value = '';
                alert('保存しました！');
                fetchLogs();

            } catch (err) {
                alert('エラー: ' + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '記録を保存する';
            }
        });

        fetchLogs();
    </script>
</body>
</html>
